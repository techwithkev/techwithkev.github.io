<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submissions & Results — Instructor Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/teacher-shared.js"></script>
  <style>
    :root {
      --navy:#0d1117;--surface:#161b22;--surface2:#1c2230;--surface3:#21262d;
      --border:#30363d;--gold:#f0b429;--text:#e6edf3;--muted:#7d8590;
      --green:#3fb950;--red:#f85149;--blue:#58a6ff;--purple:#bc8cff;--teal:#2dd4bf;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;}
    .site-header{border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;}
    .back-link{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--gold);text-decoration:none;}
    .back-link:hover{text-decoration:underline;}
    .auth-badge{display:flex;align-items:center;gap:8px;font-size:.75rem;font-family:'DM Mono',monospace;color:var(--muted);}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
    .logout-btn{background:none;border:1px solid var(--border);color:var(--red);font-size:.72rem;font-family:'DM Mono',monospace;padding:3px 9px;border-radius:5px;cursor:pointer;}
    #login-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:400px;}
    .login-card h2{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;margin-bottom:20px;}
    .field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:.875rem;font-family:'DM Mono',monospace;outline:none;margin-bottom:10px;}
    .field input:focus{border-color:var(--gold);}
    .btn-gold{width:100%;background:var(--gold);color:#1a1200;font-weight:700;font-size:.9rem;padding:11px;border:none;border-radius:10px;cursor:pointer;font-family:'DM Sans',sans-serif;}
    #login-error{color:var(--red);font-size:.78rem;margin-top:8px;}
    #app{display:none;}

    /* ── Layout ── */
    .app-layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 53px);}
    @media(max-width:900px){.app-layout{grid-template-columns:1fr;}}

    /* ── Sidebar ── */
    .sidebar{border-right:1px solid var(--border);padding:24px 0;overflow-y:auto;max-height:calc(100vh - 53px);position:sticky;top:0;}
    .sidebar-section{margin-bottom:16px;}
    .sidebar-label{font-family:'DM Mono',monospace;font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:8px 20px 4px;}
    .sidebar-select{width:calc(100% - 32px);margin:0 16px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-size:.8rem;font-family:'DM Mono',monospace;outline:none;}
    .sidebar-select:focus{border-color:var(--gold);}
    .nav-group{margin-bottom:8px;}
    .nav-group-heading{
      padding:6px 20px;font-family:'DM Mono',monospace;font-size:.68rem;
      color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
    }
    .item-row{
      display:flex;align-items:center;justify-content:space-between;
      padding:8px 20px;cursor:pointer;font-size:.82rem;gap:8px;
      transition:background .12s;border-left:3px solid transparent;
    }
    .item-row:hover{background:var(--surface2);}
    .item-row.active{background:var(--surface2);border-left-color:var(--gold);color:var(--gold);}
    .item-row .count{
      font-family:'DM Mono',monospace;font-size:.68rem;
      background:var(--surface3);border:1px solid var(--border);
      border-radius:20px;padding:1px 7px;color:var(--muted);flex-shrink:0;
    }
    .item-row.active .count{background:rgba(240,180,41,.12);border-color:rgba(240,180,41,.3);color:var(--gold);}
    .count.count-active{color:var(--text);background:rgba(240,180,41,.15);border-color:rgba(240,180,41,.35);font-weight:600;}

    /* ── Drag-and-drop reorder ── */
    .drag-handle{
      cursor:grab;color:var(--border);font-size:.9rem;line-height:1;
      opacity:0;transition:opacity .12s;flex-shrink:0;user-select:none;
      padding:0 2px;
    }
    .item-row:hover .drag-handle{opacity:1;}
    .item-row.dragging{opacity:.35;background:var(--surface3);}
    .item-row.drag-over{border-top:2px solid var(--gold);}
    .reorder-saving{
      font-family:'DM Mono',monospace;font-size:.65rem;color:var(--muted);
      padding:4px 20px 8px;display:none;
    }
    .reorder-saving.visible{display:block;}

    /* ── Main panel ── */
    .main-panel{padding:32px;overflow-x:auto;}
    .panel-header-row{
      display:flex;align-items:flex-start;justify-content:space-between;
      margin-bottom:24px;gap:16px;flex-wrap:wrap;
    }
    .panel-title{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;}
    .panel-title span{color:var(--gold);}
    .panel-meta{font-size:.78rem;color:var(--muted);margin-top:4px;}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
    .search-input{
      background:var(--surface2);border:1px solid var(--border);border-radius:8px;
      padding:7px 12px;color:var(--text);font-size:.8rem;font-family:'DM Mono',monospace;
      outline:none;width:220px;
    }
    .search-input:focus{border-color:var(--gold);}
    .btn-sm{padding:7px 13px;border-radius:7px;font-size:.78rem;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;}
    .btn-outline{background:none;border:1px solid var(--border);color:var(--text);}
    .btn-outline:hover{border-color:var(--gold);}
    .btn-auto-refresh{position:relative;}
    .btn-auto-refresh.active{border-color:var(--gold);color:var(--gold);}
    .btn-auto-refresh.active::after{
      content:'';position:absolute;top:3px;right:3px;
      width:5px;height:5px;border-radius:50%;background:var(--gold);
      animation:pulse-dot 1.5s ease-in-out infinite;
    }
    @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.6);}}

    /* ── Stats bar ── */
    .stats-bar{
      display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;
    }
    .stat-chip{
      background:var(--surface);border:1px solid var(--border);border-radius:10px;
      padding:10px 16px;display:flex;flex-direction:column;gap:2px;
    }
    .stat-chip .val{font-family:'DM Mono',monospace;font-size:1.1rem;font-weight:700;}
    .stat-chip .lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}

    /* ── Table ── */
    .data-table{width:100%;border-collapse:collapse;font-size:.82rem;}
    .data-table th{text-align:left;padding:10px 14px;font-family:'DM Mono',monospace;font-size:.67rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;}
    .data-table td{padding:11px 14px;border-bottom:1px solid rgba(48,54,61,.5);vertical-align:top;max-width:320px;}
    .data-table tr:last-child td{border-bottom:none;}
    .data-table tr:hover td{background:rgba(255,255,255,.02);cursor:pointer;}
    .trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;}
    .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.7rem;font-family:'DM Mono',monospace;}
    .badge-green{background:rgba(63,185,80,.1);color:var(--green);border:1px solid rgba(63,185,80,.2);}
    .badge-gold{background:rgba(240,180,41,.1);color:var(--gold);border:1px solid rgba(240,180,41,.2);}
    .badge-red{background:rgba(248,81,73,.1);color:var(--red);border:1px solid rgba(248,81,73,.2);}
    .badge-blue{background:rgba(88,166,255,.1);color:var(--blue);border:1px solid rgba(88,166,255,.2);}
    .badge-teal{background:rgba(45,212,191,.1);color:var(--teal);border:1px solid rgba(45,212,191,.2);}
    .empty-state{padding:48px;text-align:center;color:var(--muted);font-size:.875rem;}
    .no-exercise{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:60vh;gap:12px;color:var(--muted);
    }
    .no-exercise .icon{font-size:3rem;opacity:.4;}

    /* ── Detail drawer ── */
    .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;}
    .drawer-overlay.open{display:block;}
    .drawer{
      position:fixed;right:0;top:0;bottom:0;width:580px;max-width:100%;
      background:var(--surface);border-left:1px solid var(--border);z-index:101;
      overflow-y:auto;display:none;flex-direction:column;
    }
    .drawer.open{display:flex;}
    .drawer-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1;}
    .drawer-header h3{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;}
    .close-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:.8rem;}
    .close-btn:hover{color:var(--text);}
    .drawer-body{padding:20px 24px;flex:1;}
    .meta-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
    .meta-pill{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-family:'DM Mono',monospace;font-size:.75rem;color:var(--muted);}
    .meta-pill strong{color:var(--text);font-weight:500;}
    .payload-section{margin-top:14px;}
    .payload-section h4{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
    .payload-field{margin-bottom:14px;}
    .payload-field .pf-key{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--blue);margin-bottom:4px;}
    .payload-field .pf-val{
      background:var(--surface2);border:1px solid var(--border);border-radius:8px;
      padding:10px 12px;font-size:.82rem;line-height:1.6;white-space:pre-wrap;word-break:break-word;
    }

    /* ── Enjoyment distribution ── */
    .enjoy-dist{display:flex;gap:4px;align-items:flex-end;height:50px;margin-bottom:4px;}
    .enjoy-bar{flex:1;background:rgba(240,180,41,.15);border-radius:3px 3px 0 0;position:relative;min-height:4px;}
    .enjoy-bar-fill{position:absolute;bottom:0;left:0;right:0;background:var(--gold);border-radius:3px 3px 0 0;transition:height .3s;}
    .enjoy-labels{display:flex;gap:4px;}
    .enjoy-label{flex:1;text-align:center;font-family:'DM Mono',monospace;font-size:.65rem;color:var(--muted);}

    /* ── Exam Question Review Styles ── */
    .qn-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
    .qn-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
    .qn-title{font-size:.85rem;font-weight:700;color:var(--text);}
    .qn-meta{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);}
    .mcq-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(85px, 1fr));gap:6px;margin-top:8px;}
    .mcq-pill{background:var(--surface3);border:1px solid var(--border);border-radius:6px;padding:6px 8px;text-align:center;font-family:'DM Mono',monospace;font-size:.75rem;}
    .mcq-pill.ok{border-color:rgba(63,185,80,.4);color:var(--green);background:rgba(63,185,80,.08);}
    .mcq-pill.bad{border-color:rgba(248,81,73,.4);color:var(--red);background:rgba(248,81,73,.08);}
    .blank-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
    .blank-row{display:flex;align-items:center;gap:8px;font-size:.8rem;}
    .blank-id{font-family:'DM Mono',monospace;color:var(--blue);font-size:.75rem;min-width:75px;}
    .blank-val{font-family:'DM Mono',monospace;background:var(--surface3);padding:4px 8px;border-radius:4px;border:1px solid var(--border);flex:1;color:var(--text);}
    .rubric-box{margin-top:10px;background:rgba(240,180,41,.06);border-left:3px solid var(--gold);padding:8px 12px;font-size:.75rem;color:var(--muted);border-radius:0 6px 6px 0;line-height:1.5;}
    .rubric-box strong{color:var(--gold);}
    .ai-feedback-box{margin-top:10px;background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.3);padding:10px 14px;border-radius:8px;font-size:.8rem;color:#c9d1d9;line-height:1.5;}
    .ai-feedback-box strong{color:var(--blue);}
    .ai-score-pill{background:rgba(57,211,83,.12);border:1px solid rgba(57,211,83,.4);color:var(--green);font-family:'DM Mono',monospace;font-size:.72rem;padding:3px 8px;border-radius:12px;font-weight:700;}
  </style>
</head>
<body>

<!-- ── LOGIN ──────────────────────────────────────────────── -->
<div id="login-gate">
  <div class="login-card">
    <h2>🔑 Teacher Sign-In</h2>
    <div class="field"><input type="email"    id="l-email"    placeholder="teacher@school.ca" /></div>
    <div class="field"><input type="password" id="l-password" placeholder="Password" /></div>
    <button class="btn-gold" onclick="doLogin()">Sign In</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ── APP ───────────────────────────────────────────────── -->
<div id="app">
  <header class="site-header">
    <a href="index.html" class="back-link">← Instructor Hub</a>
    <div class="auth-badge">
      <div class="dot"></div>
      <span id="auth-label">signed in</span>
      <button class="logout-btn" onclick="doLogout()">Sign Out</button>
    </div>
  </header>

  <div class="app-layout">
    <!-- ── Sidebar ── -->
    <nav class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Course</div>
        <select class="sidebar-select" id="course-select" onchange="onCourseChange()">
          <option value="">Loading…</option>
        </select>
        <div class="sidebar-label">Cohort</div>
        <select class="sidebar-select" id="cohort-select" onchange="onCohortChange()">
          <option value="">Select cohort</option>
        </select>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label" id="sidebar-items-label">Submissions</div>
        <div id="sidebar-items-list">
          <div style="padding:12px 20px;font-size:.78rem;color:var(--muted);">Select a cohort to see submissions.</div>
        </div>
      </div>
    </nav>

    <!-- ── Main Panel ── -->
    <main class="main-panel">
      <!-- Empty state -->
      <div id="no-item-state" class="no-exercise">
        <div class="icon">📋</div>
        <div>Select a cohort and assignment from the sidebar.</div>
        <div style="font-size:.78rem;">Student results and submission details will appear here.</div>
      </div>

      <!-- Submission view -->
      <div id="submission-view" style="display:none;">
        <div class="panel-header-row">
          <div>
            <div class="panel-title" id="item-title">Assignment Name</div>
            <div class="panel-meta" id="item-meta">—</div>
          </div>
          <div class="toolbar">
            <input type="text" class="search-input" id="search-input" placeholder="Search students…" oninput="filterRows()" />
            <button class="btn-sm btn-outline btn-auto-refresh" id="auto-refresh-btn" onclick="cycleAutoRefresh()" title="Auto-refresh">↺ Auto</button>
            <button class="btn-sm btn-outline" onclick="exportCSV()">↓ CSV</button>
            <button class="btn-sm btn-outline" onclick="manualRefresh()">↻</button>
          </div>
        </div>

        <!-- Stats bar -->
        <div class="stats-bar" id="stats-bar"></div>

        <!-- Enjoyment distribution (IntroAI only) -->
        <div id="enjoy-section" style="display:none;margin-bottom:20px;">
          <div style="font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;">Enjoyment Distribution</div>
          <div class="enjoy-dist" id="enjoy-dist"></div>
          <div class="enjoy-labels">
            <div class="enjoy-label">1⭐</div>
            <div class="enjoy-label">2⭐</div>
            <div class="enjoy-label">3⭐</div>
            <div class="enjoy-label">4⭐</div>
            <div class="enjoy-label">5⭐</div>
          </div>
        </div>

        <!-- Dynamic Data Table -->
        <div style="overflow-x:auto;">
          <table class="data-table">
            <thead id="table-head">
              <tr><th>Loading…</th></tr>
            </thead>
            <tbody id="submissions-tbody">
              <tr><td class="empty-state">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ── Detail Drawer ── -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="detail-drawer">
  <div class="drawer-header">
    <h3 id="drawer-student-name">—</h3>
    <button class="close-btn" onclick="closeDrawer()">✕ Close</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<script>
  var sb = createTeacherClient();
  var currentUser   = null;
  var allCourses    = [];
  var allCohorts    = [];
  var activeCourse  = null;
  var activeCohort  = null;
  var activeCohortId = null;
  var activeItem    = null; // { type: 'introai_exercise'|'aijr_homework'|'aijr_midterm'|'aijr_final_exam', ... }
  var rawData       = [];
  var filteredData  = [];
  var cohortCodesSet = new Set();

  // AIJR Master Configuration
  var AIJR_HOMEWORKS = [
    { classNum: 1,  label: 'Class 1 — Array Shape & Pixel Matrix' },
    { classNum: 2,  label: 'Class 2 — Subgroup Bias & Learning Curves' },
    { classNum: 3,  label: 'Class 3 — Data Preprocessing & Normalization' },
    { classNum: 4,  label: 'Class 4 — Cross-Validation & Polynomials' },
    { classNum: 5,  label: 'Class 5 — Geometric MSE & Cost Function' },
    { classNum: 6,  label: 'Class 6 — Gradient Descent & Logistic Loss' },
    { classNum: 7,  label: 'Class 7 — Decision Trees & Entropy' },
    { classNum: 8,  label: 'Class 8 — Naive Bayes & K-NN Classifier' },
    { classNum: 9,  label: 'Class 9 — Kernel Trick & Soft Margin SVM' },
    { classNum: 10, label: 'Class 10 — Midterm Review & Wrap-Up' },
    { classNum: 11, label: 'Class 11 — Search Algorithms (BFS, DFS, A*)' },
    { classNum: 12, label: 'Class 12 — Constraint Propagation & Minimax' },
    { classNum: 13, label: 'Class 13 — k-Means, PCA & t-SNE' },
    { classNum: 14, label: 'Class 14 — Extended Clustering (DBSCAN / GMM)' },
    { classNum: 15, label: 'Class 15 — Outlier Penalty & Evaluation Metrics' },
    { classNum: 16, label: 'Class 16 — Reinforcement Learning & MDP' },
    { classNum: 17, label: 'Class 17 — Recommender Systems (Cosine Similarity)' },
    { classNum: 18, label: 'Class 18 — Neural Networks & Self-Attention' },
    { classNum: 19, label: 'Class 19 — Final Exam Review & Competition Prep' }
  ];

  var AIJR_EXAMS = [
    { type: 'aijr_midterm',    classNum: 10, label: 'Class 10 — Midterm Exam (Classes 1–9)', table: 'test_submissions' },
    { type: 'aijr_final_exam', classNum: 19, label: 'Class 19 — Final Practice Exam (Classes 1–18)', table: 'caio_final_exam_results' }
  ];

  // ── Auth ─────────────────────────────────────────────────────
  async function init() {
    var session = await getTeacherSession();
    if (session) { currentUser = session.user; setAuthed(); }
  }
  function setAuthed() {
    document.getElementById('login-gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('auth-label').textContent = currentUser.email;
    loadCourses();
  }
  async function doLogin() {
    var { user, error } = await TeacherAuth.login(
      document.getElementById('l-email').value.trim(),
      document.getElementById('l-password').value
    );
    if (error) { document.getElementById('login-error').textContent = error; return; }
    currentUser = user; setAuthed();
  }
  async function doLogout() { await TeacherAuth.logout(); location.reload(); }
  ['l-email','l-password'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); })
  );

  // ── Courses ──────────────────────────────────────────────────
  async function loadCourses() {
    var { data } = await sb.from('courses').select('id,slug,name').eq('is_active',true).order('name');
    allCourses = data || [];
    var sel = document.getElementById('course-select');
    sel.innerHTML = allCourses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    if (allCourses.length) await onCourseChange();
  }

  async function onCourseChange() {
    var courseId = document.getElementById('course-select').value;
    if (!courseId) return;
    activeCourse = allCourses.find(c => String(c.id) === String(courseId));

    // Load cohorts for this course
    var { data } = await sb
      .from('cohorts')
      .select('id,slug,name,term')
      .eq('course_id', courseId)
      .eq('is_active', true)
      .order('created_at', { ascending: false });

    allCohorts = data || [];
    var cohortSel = document.getElementById('cohort-select');
    cohortSel.innerHTML = allCohorts.length
      ? allCohorts.map(c => `<option value="${c.id}">${c.name}${c.term ? ' — ' + c.term : ''}</option>`).join('')
      : '<option value="">No cohorts found</option>';

    if (allCohorts.length) {
      activeCohortId = allCohorts[0].id;
      activeCohort = allCohorts[0];
      await onCohortChange();
    } else {
      activeCohortId = null;
      activeCohort = null;
      document.getElementById('sidebar-items-list').innerHTML =

  async function onCohortChange() {
    activeCohortId = document.getElementById('cohort-select').value;
    activeCohort = allCohorts.find(c => String(c.id) === String(activeCohortId));
    if (!activeCohortId) return;

    // Reset view
    document.getElementById('no-item-state').style.display = 'flex';
    document.getElementById('submission-view').style.display = 'none';
    activeItem = null;

    // Load access codes for this cohort to aid matching
    var { data: codes } = await sb
      .from('access_codes')
      .select('code')
      .eq('cohort_id', activeCohortId);
    cohortCodesSet = new Set((codes || []).map(c => (c.code || '').toUpperCase()));

    if (activeCourse?.slug === 'aijr') {
      await renderAijrSidebar();
    } else {
      await renderIntroAiSidebar();
    }
  }

  function matchesCohort(r) {
    if (r.cohort_id && String(r.cohort_id) === String(activeCohortId)) return true;
    if (activeCohort) {
      if (r.cohort && (r.cohort.toLowerCase() === (activeCohort.slug || '').toLowerCase() || r.cohort.toLowerCase() === (activeCohort.name || '').toLowerCase())) return true;
    }
    if (r.access_code && cohortCodesSet.has(r.access_code.toUpperCase())) return true;
    return false;
  }

  // ── Render Intro to AI Sidebar ───────────────────────────────
  async function renderIntroAiSidebar() {
    document.getElementById('sidebar-items-label').textContent = 'Exercises';
    var list = document.getElementById('sidebar-items-list');
    list.innerHTML = '<div style="padding:12px 20px;font-size:.78rem;color:var(--muted);">⏳ Loading exercises…</div>';

    var [exRes, subRes] = await Promise.all([
      sb.from('exercise_definitions')
        .select('id,exercise_slug,label,week_number,sequence_order')
        .eq('course_id', activeCourse.id)
        .eq('is_active', true)
        .order('week_number')
        .order('sequence_order'),
      sb.from('exercise_submissions').select('exercise_id').eq('cohort_id', activeCohortId)
    ]);

    var allExercises = exRes.data || [];
    var counts = {};
    (subRes.data || []).forEach(r => { counts[r.exercise_id] = (counts[r.exercise_id] || 0) + 1; });

    if (!allExercises.length) {
      list.innerHTML = '<div style="padding:12px 20px;font-size:.78rem;color:var(--muted);">No exercises registered for Intro to AI.</div>';
      return;
    }

    var byWeek = {};
    allExercises.forEach(ex => {
      var wk = ex.week_number || 0;
      if (!byWeek[wk]) byWeek[wk] = [];
      byWeek[wk].push(ex);
    });

    var savingEl = document.createElement('div');
    savingEl.className = 'reorder-saving';
    savingEl.id = 'reorder-saving';
    savingEl.textContent = '⏳ Saving order…';

    list.innerHTML = '';
    list.appendChild(savingEl);

    Object.entries(byWeek)
      .sort(([a],[b]) => Number(a) - Number(b))
      .forEach(([wk, exs]) => {
        var group = document.createElement('div');
        group.className = 'nav-group';
        group.dataset.week = wk;

        var heading = document.createElement('div');
        heading.className = 'nav-group-heading';
        heading.textContent = 'Week ' + wk;
        group.appendChild(heading);

        exs.forEach(ex => {
          var row = document.createElement('div');
          row.className = 'item-row';
          row.id = 'item-ex-' + ex.id;
          row.dataset.exId = ex.id;
          row.dataset.exSlug = ex.exercise_slug;
          row.dataset.exLabel = ex.label;
          row.dataset.weekNum = wk;
          row.draggable = true;

          var handle = document.createElement('span');
          handle.className = 'drag-handle';
          handle.textContent = '⠿';
          handle.title = 'Drag to reorder';

          var label = document.createElement('span');
          label.textContent = ex.label.replace(/^Week \d+ — /, '');

          var count = document.createElement('span');
          var countVal = counts[ex.id] || 0;
          count.className = 'count' + (countVal > 0 ? ' count-active' : '');
          count.textContent = countVal;

          row.appendChild(handle);
          row.appendChild(label);
          row.appendChild(count);

          // Click to select (avoid triggering on drag)
          row.addEventListener('click', function(e) {
            if (row.dataset.dragged === '1') { row.dataset.dragged = '0'; return; }
            selectItem('introai_exercise', Number(ex.id), ex.label, ex.exercise_slug);
          });

          attachDragEvents(row);
          group.appendChild(row);
        });

        list.appendChild(group);
      });
  }

  // ── Drag-and-drop helpers ─────────────────────────────────────
  var _dragSrc = null;

  function attachDragEvents(row) {
    row.addEventListener('dragstart', function(e) {
      _dragSrc = row;
      row.dataset.dragged = '1';
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', row.dataset.exId);
    });
    row.addEventListener('dragend', function() {
      row.classList.remove('dragging');
      document.querySelectorAll('.item-row.drag-over').forEach(el => el.classList.remove('drag-over'));
      _dragSrc = null;
    });
    row.addEventListener('dragover', function(e) {
      if (!_dragSrc || _dragSrc === row) return;
      // Only allow reorder within same week group
      if (_dragSrc.dataset.weekNum !== row.dataset.weekNum) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.item-row.drag-over').forEach(el => el.classList.remove('drag-over'));
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', function() {
      row.classList.remove('drag-over');
    });
    row.addEventListener('drop', function(e) {
      e.preventDefault();
      if (!_dragSrc || _dragSrc === row) return;
      if (_dragSrc.dataset.weekNum !== row.dataset.weekNum) return;
      row.classList.remove('drag-over');

      // Reorder DOM
      var parent = row.parentNode;
      var allRows = Array.from(parent.querySelectorAll('.item-row'));
      var srcIdx = allRows.indexOf(_dragSrc);
      var tgtIdx = allRows.indexOf(row);
      if (srcIdx < tgtIdx) {
        parent.insertBefore(_dragSrc, row.nextSibling);
      } else {
        parent.insertBefore(_dragSrc, row);
      }

      saveExerciseOrder(parent);
    });
  }

  async function saveExerciseOrder(groupEl) {
    var rows = Array.from(groupEl.querySelectorAll('.item-row'));
    var savingEl = document.getElementById('reorder-saving');
    if (savingEl) { savingEl.textContent = '⏳ Saving order…'; savingEl.classList.add('visible'); }

    var updates = rows.map((row, idx) =>
      sb.from('exercise_definitions')
        .update({ sequence_order: idx + 1 })
        .eq('id', Number(row.dataset.exId))
    );

    var results = await Promise.all(updates);
    var { error } = results.find(r => r.error) || {};

    if (savingEl) {
      if (error) {
        savingEl.textContent = '❌ Failed to save order';
        console.error('Reorder save error:', error);
      } else {
        savingEl.textContent = '✓ Order saved';
      }
      setTimeout(() => savingEl.classList.remove('visible'), 2000);
    }
  }

  // ── Auto-refresh ──────────────────────────────────────────────
  var autoRefresh = {
    intervals: [0, 30, 60, 300], // seconds; 0 = off
    labels:    ['↺ Auto', '↺ 30s', '↺ 1m', '↺ 5m'],
    idx: 0,
    timer: null,
    countdown: null,
    remaining: 0
  };

  function cycleAutoRefresh() {
    autoRefresh.idx = (autoRefresh.idx + 1) % autoRefresh.intervals.length;
    applyAutoRefresh();
  }

  function applyAutoRefresh() {
    // Clear existing timers
    if (autoRefresh.timer)    { clearInterval(autoRefresh.timer);    autoRefresh.timer = null; }
    if (autoRefresh.countdown){ clearInterval(autoRefresh.countdown); autoRefresh.countdown = null; }

    var btn = document.getElementById('auto-refresh-btn');
    var secs = autoRefresh.intervals[autoRefresh.idx];

    if (!secs) {
      btn.textContent = '↺ Auto';
      btn.classList.remove('active');
      return;
    }

    btn.classList.add('active');
    autoRefresh.remaining = secs;

    // Countdown display
    function updateLabel() {
      var m = Math.floor(autoRefresh.remaining / 60);
      var s = autoRefresh.remaining % 60;
      btn.textContent = m ? `↺ ${m}m${s ? s + 's' : ''}` : `↺ ${autoRefresh.remaining}s`;
      autoRefresh.remaining--;
    }
    updateLabel();
    autoRefresh.countdown = setInterval(function() {
      if (autoRefresh.remaining <= 0) { autoRefresh.remaining = secs; loadSubmissions(); }
      updateLabel();
    }, 1000);
  }

  function manualRefresh() {
    // Reset countdown on manual refresh
    autoRefresh.remaining = autoRefresh.intervals[autoRefresh.idx];
    loadSubmissions();
  }

  // ── Selection & Loading ──────────────────────────────────────
  async function selectItem(type, idOrNum, label, slug = '') {
    activeItem = { type, id: idOrNum, classNum: idOrNum, label, slug };

    document.querySelectorAll('.item-row').forEach(el => el.classList.remove('active'));
    var itemId = type === 'introai_exercise' ? `item-ex-${idOrNum}`
      : type === 'aijr_homework' ? `item-hw-${idOrNum}`
      : type === 'aijr_midterm' ? 'item-midterm' : 'item-final_exam';
    document.getElementById(itemId)?.classList.add('active');

    document.getElementById('no-item-state').style.display = 'none';
    document.getElementById('submission-view').style.display = 'block';
    document.getElementById('item-title').innerHTML = `<span>${label}</span>`;

    await loadSubmissions();
  }

  async function loadSubmissions() {
    if (!activeItem || !activeCohortId) return;
    var cohortName = activeCohort?.name || 'Cohort';
    document.getElementById('item-meta').textContent = `${cohortName} · Loading submissions…`;

    if (activeItem.type === 'introai_exercise') {
      var { data } = await sb
        .from('exercise_submissions')
        .select('*')
        .eq('exercise_id', activeItem.id)
        .eq('cohort_id', activeCohortId)
        .order('submitted_at', { ascending: false });
      rawData = data || [];
    } else if (activeItem.type === 'aijr_homework') {
      var { data } = await sb
        .from('homework_submissions')
        .select('*')
        .eq('class_number', activeItem.classNum)
        .order('submitted_at', { ascending: false });
      rawData = (data || []).filter(matchesCohort);
    } else if (activeItem.type === 'aijr_midterm') {
      var { data } = await sb
        .from('test_submissions')
        .select('*')
        .order('submitted_at', { ascending: false });
      rawData = (data || []).filter(matchesCohort);
    } else if (activeItem.type === 'aijr_final_exam') {
      var { data } = await sb
        .from('caio_final_exam_results')
        .select('*')
        .order('submitted_at', { ascending: false });
      rawData = (data || []).filter(matchesCohort);
    }

    filteredData = rawData.slice();
    document.getElementById('item-meta').textContent = `${cohortName} · ${rawData.length} submission${rawData.length !== 1 ? 's' : ''}`;

    renderStats();
    renderTable();
  }

  // ── Render Stats & Headers ───────────────────────────────────
  function renderStats() {
    var total = rawData.length;
    var statsBar = document.getElementById('stats-bar');
    var enjoySec = document.getElementById('enjoy-section');
    enjoySec.style.display = 'none';

    if (activeItem.type === 'introai_exercise') {
      var withEnjoy = rawData.filter(r => r.enjoyment_rating);
      var avgEnjoy = withEnjoy.length
        ? (withEnjoy.reduce((s, r) => s + r.enjoyment_rating, 0) / withEnjoy.length).toFixed(1)
        : '—';
      statsBar.innerHTML = `
        <div class="stat-chip"><div class="val">${total}</div><div class="lbl">Submissions</div></div>
        <div class="stat-chip"><div class="val">${avgEnjoy}</div><div class="lbl">Avg Enjoyment</div></div>
        <div class="stat-chip"><div class="val">${rawData.length ? fmtDate(rawData[0].submitted_at) : '—'}</div><div class="lbl">Latest</div></div>
      `;
      if (withEnjoy.length) {
        var dist = [0,0,0,0,0];
        withEnjoy.forEach(r => { if (r.enjoyment_rating >= 1 && r.enjoyment_rating <= 5) dist[r.enjoyment_rating-1]++; });
        var maxVal = Math.max(...dist, 1);
        enjoySec.style.display = 'block';
        document.getElementById('enjoy-dist').innerHTML = dist.map((v, i) => `
          <div class="enjoy-bar" title="${i+1}★: ${v} student${v!==1?'s':''}">
            <div class="enjoy-bar-fill" style="height:${Math.round((v/maxVal)*100)}%;"></div>
          </div>
        `).join('');
      }
    } else if (activeItem.type === 'aijr_homework') {
      var pcts = rawData.map(r => r.pct != null ? Number(r.pct) : (r.score != null && r.total ? Math.round((r.score/r.total)*100) : null)).filter(p => p != null);
      var avgPct = pcts.length ? Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length) + '%' : '—';
      var maxPct = pcts.length ? Math.max(...pcts) + '%' : '—';
      statsBar.innerHTML = `
        <div class="stat-chip"><div class="val">${total}</div><div class="lbl">Submissions</div></div>
        <div class="stat-chip"><div class="val">${avgPct}</div><div class="lbl">Average Score</div></div>
        <div class="stat-chip"><div class="val">${maxPct}</div><div class="lbl">Highest Score</div></div>
        <div class="stat-chip"><div class="val">${rawData.length ? fmtDate(rawData[0].submitted_at) : '—'}</div><div class="lbl">Latest</div></div>
      `;
    } else if (activeItem.type === 'aijr_midterm' || activeItem.type === 'aijr_final_exam') {
      var scores = rawData.map(r => r.auto_score != null ? Number(r.auto_score) : (r.score != null ? Number(r.score) : null)).filter(s => s != null);
      var avgScore = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : '—';
      var maxScore = scores.length ? Math.max(...scores) : '—';
      statsBar.innerHTML = `
        <div class="stat-chip"><div class="val">${total}</div><div class="lbl">Exams Taken</div></div>
        <div class="stat-chip"><div class="val">${avgScore}</div><div class="lbl">Avg Score</div></div>
        <div class="stat-chip"><div class="val">${maxScore}</div><div class="lbl">Highest Score</div></div>
        <div class="stat-chip"><div class="val">${rawData.length ? fmtDate(rawData[0].submitted_at) : '—'}</div><div class="lbl">Latest</div></div>
      `;
    }
  }

            <td style="font-family:'DM Mono',monospace;color:var(--muted);">${r.blank_score != null ? r.blank_score + '/15' : '—'}</td>
            <td style="font-family:'DM Mono',monospace;color:var(--teal);font-weight:600;">${oeScore != null ? oeScore + '/15' : '—'}</td>

            <td style="font-size:.75rem;color:var(--muted);white-space:nowrap;">${fmtDate(r.submitted_at)}</td>
          </tr>`;
      }
    }).join('');
  }

  function filterRows() {
    var q = document.getElementById('search-input').value.toLowerCase();
    filteredData = q
      ? rawData.filter(r =>
          (r.student_name || '').toLowerCase().includes(q) ||
          (r.student_email || '').toLowerCase().includes(q) ||
          (r.access_code || '').toLowerCase().includes(q)
        )
      : rawData.slice();
    renderTable();
  }

  // ── Detail Drawer ────────────────────────────────────────────
  function openDrawer(idx) {
    var r = filteredData[idx];
    if (!r) return;
    document.getElementById('drawer-student-name').textContent = r.student_name;
    var body = document.getElementById('drawer-body');

    if (activeItem.type === 'introai_exercise') {
      var stars = r.enjoyment_rating ? '⭐'.repeat(r.enjoyment_rating) + ' ' + r.enjoyment_rating + '/5' : 'Not rated';
      body.innerHTML = `
        <div class="meta-row">
          <div class="meta-pill">📧 <strong>${esc(r.student_email || '—')}</strong></div>
          <div class="meta-pill">🕐 <strong>${fmtDateFull(r.submitted_at)}</strong></div>
          <div class="meta-pill">⭐ <strong>${stars}</strong></div>
        </div>
        <div class="payload-section">
          <h4>Submission Details</h4>
          ${renderPayloadFields(r.payload)}
        </div>
      `;
    } else if (activeItem.type === 'aijr_homework') {
      var pct = r.pct != null ? r.pct : (r.score != null && r.total ? Math.round((r.score/r.total)*100) : '—');
      body.innerHTML = `
        <div class="meta-row">
          <div class="meta-pill">Class <strong>${r.class_number}</strong></div>
          <div class="meta-pill">Score <strong>${r.score}/${r.total} (${pct}%)</strong></div>
          <div class="meta-pill">Code <strong>${esc(r.access_code || '—')}</strong></div>
          <div class="meta-pill">🕐 <strong>${fmtDateFull(r.submitted_at)}</strong></div>
        </div>
        <div class="payload-section">
          <h4>Question Responses & Feedback</h4>
          ${renderHomeworkDetails(r.question_detail)}
        </div>
      `;
    } else if (activeItem.type === 'aijr_midterm') {
      var qd = typeof r.question_detail === 'string' ? (()=>{ try { return JSON.parse(r.question_detail); } catch(e){ return {}; } })() : (r.question_detail || {});
      var oeScore = qd?.summary?.open_ended_score != null
        ? qd.summary.open_ended_score
        : (qd?.q21?.score != null ? qd.q21.score : null);
      var pct = r.pct != null ? Math.round(r.pct) : (r.auto_score != null ? Math.round((r.auto_score / 60) * 100) : 0);
      body.innerHTML = `
        <div class="meta-row">
          <div class="meta-pill">Auto Score <strong>${r.auto_score != null ? r.auto_score : '—'}/60 (${pct}%)</strong></div>
          <div class="meta-pill">MCQ <strong>${r.mcq_score != null ? r.mcq_score : '—'}/30</strong></div>
          <div class="meta-pill">Blanks <strong>${r.blank_score != null ? r.blank_score : '—'}/25</strong></div>
          <div class="meta-pill">Open-Ended (AI) <strong>${oeScore != null ? oeScore + '/5' : '—'}</strong></div>
          <div class="meta-pill">Code <strong>${esc(r.access_code || '—')}</strong></div>
          <div class="meta-pill">🕐 <strong>${fmtDateFull(r.submitted_at)}</strong></div>
        </div>
        <div class="payload-section">
          <h4>Midterm Assessment Review</h4>
          ${renderMidtermDetails(r.question_detail)}
        </div>
      `;
    } else if (activeItem.type === 'aijr_final_exam') {
      var details = typeof r.mcq_details === 'string' ? (()=>{ try { return JSON.parse(r.mcq_details); } catch(e){ return {}; } })() : (r.mcq_details || {});
      var oeScore = details?.summary?.open_ended_score != null
        ? details.summary.open_ended_score
        : ((details?.q17?.score || 0) + (details?.q18?.score || 0) + (details?.q21?.score || 0));
      var pct = r.auto_score != null ? Math.round((r.auto_score / 60) * 100) : 0;
      body.innerHTML = `
        <div class="meta-row">
          <div class="meta-pill">Auto Score <strong>${r.auto_score != null ? r.auto_score : '—'}/60 (${pct}%)</strong></div>
          <div class="meta-pill">MCQ <strong>${r.mcq_score != null ? r.mcq_score : '—'}/30</strong></div>
          <div class="meta-pill">Blanks <strong>${r.blank_score != null ? r.blank_score : '—'}/15</strong></div>
          <div class="meta-pill">Open-Ended (AI) <strong>${oeScore}/15</strong></div>
          <div class="meta-pill">Code <strong>${esc(r.access_code || '—')}</strong></div>

  function closeDrawer() {
    document.getElementById('detail-drawer').classList.remove('open');
    document.getElementById('drawer-overlay').classList.remove('open');
  }

  // ── Render Helpers for Payloads ──────────────────────────────
  function renderPayloadFields(payload) {
    if (!payload || typeof payload !== 'object') return '<div style="color:var(--muted);">No payload data.</div>';
    return Object.entries(payload).map(([k, v]) => {
      var display = typeof v === 'object' ? JSON.stringify(v, null, 2) : String(v);
      return `
        <div class="payload-field">
          <div class="pf-key">${esc(k)}</div>
          <div class="pf-val">${esc(display)}</div>
        </div>`;
    }).join('');
  }

  function renderHomeworkDetails(qd) {
    if (!qd) return '<div style="color:var(--muted);">No question details recorded.</div>';
    var data = typeof qd === 'string' ? JSON.parse(qd) : qd;
    if (typeof data !== 'object') return `<pre class="pf-val">${esc(String(qd))}</pre>`;
    return Object.entries(data).map(([k, v]) => {
      var txt = typeof v === 'object' ? JSON.stringify(v, null, 2) : String(v);
      return `
        <div class="payload-field">
          <div class="pf-key">${esc(k)}</div>
          <div class="pf-val">${esc(txt)}</div>
        </div>`;
    }).join('');
  }

  function renderMidtermDetails(qd) {
    if (!qd) return '<div style="color:var(--muted);">No question details recorded.</div>';
    var data = typeof qd === 'string' ? (()=>{ try { return JSON.parse(qd); } catch(e){ return null; } })() : qd;
    if (!data || typeof data !== 'object') return `<pre class="pf-val">${esc(String(qd))}</pre>`;

    var html = '';
    // 1. MCQ Grid (Q1–Q15)
    if (data.mcq) {
      var pills = Object.entries(data.mcq).map(([k, v]) => {
        var isOk = v.correct === true;
        var ans = v.answer || '—';
        return `<div class="mcq-pill ${isOk ? 'ok' : 'bad'}">${k.toUpperCase()}: ${ans} ${isOk ? '✓' : '✗'}</div>`;
      }).join('');
      var mcqScore = data?.summary?.mcq_score != null ? data.summary.mcq_score : Object.values(data.mcq).filter(v => v.correct).length * 2;
      html += `
        <div class="qn-card">
          <div class="qn-head">
            <div class="qn-title">Q1–Q15: Multiple Choice Questions</div>
            <div class="qn-meta"><span class="ai-score-pill">${mcqScore}/30 pts</span></div>
          </div>
          <div class="mcq-grid">${pills}</div>
        </div>
      `;
    }

    // 2. Q16–Q20 blanks
    var midTitles = {
      16: 'Q16 · Data Preprocessing blanks (Class 3)',
      17: 'Q17 · MSE Cost Function blanks (Class 5)',
      18: 'Q18 · Confusion Matrix Metrics blanks (Class 6)',
      19: 'Q19 · Sigmoid & Predict blanks (Class 6)',
      20: 'Q20 · Kernel Trick blanks (Class 9)'
    };
    var midModelAnswers = {
      16: "b1: <code>fillna(0)</code> · b2: <code>fillna(mean)</code> · b3: <code>units_sold*price*(1-discount)</code> · b4: <code>'store_id'</code> · b5: <code>sum</code> · b6: <code>sort_values(ascending=False)</code>",
      17: "b1: <code>w*x[i]+b</code> · b2: <code>(f_wb-y[i])**2</code>",
      18: "b1: <code>(TP+TN)/total</code> · b2: <code>TP/(TP+FP)</code> · b3: <code>TP/(TP+FN)</code> · b4: <code>2*P*R/(P+R)</code>",
      19: "b1: <code>1/(1+np.exp(-z))</code> · b2: <code>w@X.T+b</code> · b3: <code>sigmoid(z)</code> · b4: <code>astype(int)</code>",
      20: "b1: <code>(x*xp+1)**2</code> · b2: <code>[x, x**2]</code> · b3: <code>math.exp(-gamma*distance**2)</code>"
    };

    [16, 17, 18, 19, 20].forEach(q => {
      var r = data[`q${q}`];
      if (r && r.items) {
        html += `
          <div class="qn-card">
            <div class="qn-head">
              <div class="qn-title">${midTitles[q]}</div>
              <div class="qn-meta"><span class="ai-score-pill">${r.pts || 0}/5 pts</span></div>
            </div>
            <div class="blank-list">
              ${r.items.map(b => `<div class="blank-row"><span class="blank-id">${b.id}:</span><code class="blank-val">${b.ok ? '✅' : '❌'} ${esc(b.val || '—')}</code></div>`).join('')}
            </div>
            <div class="rubric-box"><strong>📋 Model Answer:</strong> ${midModelAnswers[q]}</div>
          </div>
        `;
      }
    });

    // 3. Q21 Open-Ended (Bias/Variance & Overfitting)
    if (data.q21) {
      var q21Score = data.q21.score != null ? data.q21.score : (data?.summary?.open_ended_score != null ? data.summary.open_ended_score : '—');
      var q21Feedback = data.q21.feedback || '';
      var studentTxt = data.q21.student_text || data.q21.text || '';
      html += `
        <div class="qn-card">
          <div class="qn-head">
            <div class="qn-title">Q21 · Bias/Variance & Overfitting Remediation (Open-Ended)</div>
            <div class="qn-meta"><span class="ai-score-pill">🤖 Groq AI Score: ${q21Score}/5 pts</span></div>
          </div>
          <div class="pf-val">${esc(studentTxt || '(No response provided)')}</div>
          ${q21Feedback ? `<div class="ai-feedback-box"><strong>🤖 Groq LLM Evaluation:</strong> ${esc(q21Feedback)}</div>` : ''}
          <div class="rubric-box"><strong>📋 Model Answer & Rubric:</strong> Train R² ≫ Test R² indicates overfitting / high variance (Class 2). Remediation: regularization (L1/L2), simpler model/less polynomial features, more data, or k-fold CV (Class 4). Explicitly link high variance to model complexity and need for generalization.</div>
        </div>
      `;
    }

    return html || `<pre class="pf-val">${esc(JSON.stringify(data, null, 2))}</pre>`;
  }

  function renderFinalExamDetails(r) {
    var html = '';
    var details = typeof r.mcq_details === 'string' ? (()=>{ try { return JSON.parse(r.mcq_details); } catch(e){ return {}; } })() : (r.mcq_details || {});

    // 1. MCQ Breakdown (Q1–Q15)
    var mcqPills = [];
    for (var q = 1; q <= 15; q++) {
      var item = details['q' + q];
      if (item) {
        var isOk = item.correct === true;
        var ans = item.answer || '—';
        mcqPills.push(`<div class="mcq-pill ${isOk ? 'ok' : 'bad'}">Q${q}: ${ans} ${isOk ? '✓' : '✗'}</div>`);
      }
    }
    if (mcqPills.length) {
      html += `
        <div class="qn-card">
          <div class="qn-head">
            <div class="qn-title">Q1–Q15: Multiple Choice Questions</div>
            <div class="qn-meta"><span class="ai-score-pill">${r.mcq_score != null ? r.mcq_score : '—'}/30 pts</span></div>
          </div>
          <div class="mcq-grid">${mcqPills.join('')}</div>
        </div>
      `;
    }

    // 2. Q16 Blanks (A* Search)
    var q16Info = details.q16 || {};
    var q16Blanks = [
      { id: 'b1 (start cost)', val: r.q16_b1 },
      { id: 'b2 (pop queue)',  val: r.q16_b2 },
      { id: 'b3 (h[neighbor])',val: r.q16_b3 },
      { id: 'b4 (push queue)', val: r.q16_b4 },
      { id: 'b5 (came_from)',  val: r.q16_b5 },
      { id: 'b6 (append)',     val: r.q16_b6 }
    ];
    var q16Pts = q16Info.pts != null ? q16Info.pts : (q16Info.cor != null ? q16Info.cor : '—');
    html += `
      <div class="qn-card">
        <div class="qn-head">
          <div class="qn-title">Q16 · A* Search Algorithm (Fill-in-the-Blanks)</div>
          <div class="qn-meta"><span class="ai-score-pill">${q16Pts}/5 pts</span></div>
        </div>
        <div class="blank-list">
          ${q16Blanks.map((b, idx) => {
            var itemCheck = q16Info.items ? q16Info.items[idx]?.ok : null;
            var mark = itemCheck === true ? '✅' : itemCheck === false ? '❌' : '•';
            return `<div class="blank-row"><span class="blank-id">${b.id}:</span><code class="blank-val">${mark} ${esc(b.val || '—')}</code></div>`;
          }).join('')}
        </div>
        <div class="rubric-box"><strong>📋 Model Answer:</strong> b1: <code>0</code> · b2: <code>heappop</code> · b3: <code>h[neighbor]</code> · b4: <code>heappush</code> · b5: <code>node</code> · b6: <code>append</code></div>
      </div>
    `;

    // 3. Q17 Open-Ended (k-Means Outliers & Inertia)
    var q17Info = details.q17 || {};
    var q17Score = q17Info.score != null ? q17Info.score : (r.q17_score != null ? r.q17_score : '—');
    html += `
      <div class="qn-card">
        <div class="qn-head">
          <div class="qn-title">Q17 · k-Means Centroid Update & Inertia Calculation</div>
          <div class="qn-meta"><span class="ai-score-pill">🤖 Groq AI Score: ${q17Score}/5 pts</span></div>
        </div>
        <div class="pf-val">${esc(r.q17_text || '(No response provided)')}</div>
        ${q17Info.feedback ? `<div class="ai-feedback-box"><strong>🤖 Groq LLM Evaluation:</strong> ${esc(q17Info.feedback)}</div>` : ''}
        <div class="rubric-box"><strong>📋 Model Answer & Rubric:</strong> Centroid A=(3, 2.67), Centroid B=(9, 7). Inertia(A) = 10.67. Moving the outlier (9,7) to new cluster B reduces cluster A inertia by 75%+.</div>
      </div>
    `;

    // 4. Q18 Open-Ended (Naive Bayes Spam)
    var q18Info = details.q18 || {};
    var q18Score = q18Info.score != null ? q18Info.score : (r.q18_score != null ? r.q18_score : '—');
    html += `
      <div class="qn-card">
        <div class="qn-head">
          <div class="qn-title">Q18 · Naive Bayes Spam Classification</div>
          <div class="qn-meta"><span class="ai-score-pill">🤖 Groq AI Score: ${q18Score}/5 pts</span></div>
        </div>
        <div class="pf-val">${esc(r.q18_text || '(No response provided)')}</div>
        ${q18Info.feedback ? `<div class="ai-feedback-box"><strong>🤖 Groq LLM Evaluation:</strong> ${esc(q18Info.feedback)}</div>` : ''}
        <div class="rubric-box"><strong>📋 Model Answer & Rubric:</strong> Score(Spam) = 0.40 × 0.80 × 0.70 = 0.224. Score(Not Spam) = 0.60 × 0.10 × 0.05 = 0.003. P(Spam|email) = 0.224 / 0.227 ≈ 98.7% → Classified as Spam.</div>
      </div>
    `;

    // 5. Q19 Blanks (k-Means Scikit-Learn)
    var q19Info = details.q19 || {};
    var q19Blanks = [
      { id: 'b1 (cluster)', val: r.q19_b1 },
      { id: 'b2 (n_clusters)', val: r.q19_b2 },
      { id: 'b3 (fit)',     val: r.q19_b3 },
      { id: 'b4 (labels_)', val: r.q19_b4 },
      { id: 'b5 (inertia_)',val: r.q19_b5 },
      { id: 'b6 (labels_)', val: r.q19_b6 }
    ];
    var q19Pts = q19Info.pts != null ? q19Info.pts : (q19Info.cor != null ? q19Info.cor : '—');
    html += `
      <div class="qn-card">
        <div class="qn-head">
          <div class="qn-title">Q19 · k-Means in Scikit-Learn (Fill-in-the-Blanks)</div>
          <div class="qn-meta"><span class="ai-score-pill">${q19Pts}/5 pts</span></div>
        </div>
        <div class="blank-list">
          ${q19Blanks.map((b, idx) => {
            var itemCheck = q19Info.items ? q19Info.items[idx]?.ok : null;
            var mark = itemCheck === true ? '✅' : itemCheck === false ? '❌' : '•';
            return `<div class="blank-row"><span class="blank-id">${b.id}:</span><code class="blank-val">${mark} ${esc(b.val || '—')}</code></div>`;
          }).join('')}
        </div>
        <div class="rubric-box"><strong>📋 Model Answer:</strong> b1: <code>cluster</code> · b2: <code>3</code> · b3: <code>fit</code> · b4: <code>labels_</code> · b5: <code>inertia_</code> · b6: <code>labels_</code> (or <code>km.labels_</code>)</div>
      </div>
    `;

    // 6. Q20 Blanks (Q-Learning Update)
    var q20Info = details.q20 || {};
    var q20Blanks = [
      { id: 'b1 (state)',     val: r.q20_b1 },
      { id: 'b2 (action)',    val: r.q20_b2 },
      { id: 'b3 (max)',       val: r.q20_b3 },
      { id: 'b4 (best_next)', val: r.q20_b4 },
      { id: 'b5 (alpha)',     val: r.q20_b5 }
    ];
    var q20Pts = q20Info.pts != null ? q20Info.pts : (q20Info.cor != null ? q20Info.cor : '—');
    html += `
      <div class="qn-card">
        <div class="qn-head">
          <div class="qn-title">Q20 · Q-Learning Algorithm Update (Fill-in-the-Blanks)</div>
          <div class="qn-meta"><span class="ai-score-pill">${q20Pts}/5 pts</span></div>
        </div>
        <div class="blank-list">
          ${q20Blanks.map((b, idx) => {
            var itemCheck = q20Info.items ? q20Info.items[idx]?.ok : null;
            var mark = itemCheck === true ? '✅' : itemCheck === false ? '❌' : '•';
            return `<div class="blank-row"><span class="blank-id">${b.id}:</span><code class="blank-val">${mark} ${esc(b.val || '—')}</code></div>`;
          }).join('')}
        </div>
        <div class="rubric-box"><strong>📋 Model Answer:</strong> b1: <code>state</code> · b2: <code>action</code> · b3: <code>max</code> (or <code>np.max</code>) · b4: <code>best_next</code> · b5: <code>alpha</code> (or <code>learning_rate</code>)</div>
      </div>
    `;

    // 7. Q21 Open-Ended (A* vs Q-learning)
    var q21Info = details.q21 || {};
    var q21Score = q21Info.score != null ? q21Info.score : (r.q21_score != null ? r.q21_score : '—');
    html += `
      <div class="qn-card">
        <div class="qn-head">
          <div class="qn-title">Q21 · A* vs Q-Learning Robotics (Open-Ended)</div>
          <div class="qn-meta"><span class="ai-score-pill">🤖 Groq AI Score: ${q21Score}/5 pts</span></div>
        </div>
        <div class="pf-val">${esc(r.q21_text || '(No response provided)')}</div>
        ${q21Info.feedback ? `<div class="ai-feedback-box"><strong>🤖 Groq LLM Evaluation:</strong> ${esc(q21Info.feedback)}</div>` : ''}
        <div class="rubric-box"><strong>📋 Model Answer & Rubric:</strong> (1) A* for known map with static obstacles + admissible heuristic guarantees shortest path. (2) Q-learning for dynamic/unknown map learning from rewards (State=pos, Action=step, Reward=penalty/goal). (3) γ=0.9 heavily weights future rewards, motivating robot to reach destination quickly.</div>
      </div>
    `;

    return html;
  }

  function getPayloadPreview(payload) {
    if (!payload || typeof payload !== 'object') return '';
    var vals = Object.values(payload).filter(v => typeof v === 'string' && v.length > 2);
    return vals[0] ? vals[0].slice(0, 80) : JSON.stringify(payload).slice(0, 80);
  }

  function getHomeworkPreview(qd) {
    if (!qd) return '';
    var obj = typeof qd === 'string' ? (()=>{ try { return JSON.parse(qd); } catch(e){ return null; } })() : qd;
    if (obj && typeof obj === 'object') {
      var keys = Object.keys(obj);
      return `${keys.length} items logged`;
    }
    return '';
  }

  // ── CSV Export ────────────────────────────────────────────────
  function exportCSV() {
    if (!rawData.length) { alert('No data to export.'); return; }
    var headers = [];
    var rows = [];

    if (activeItem.type === 'introai_exercise') {
      var payloadKeys = new Set();
      rawData.forEach(r => { if (r.payload) Object.keys(r.payload).forEach(k => payloadKeys.add(k)); });
      var pkArr = Array.from(payloadKeys);
      headers = ['student_name','student_email','enjoyment_rating','submitted_at', ...pkArr];
      rows = rawData.map(r =>
        headers.map(h => {
          if (['student_name','student_email','enjoyment_rating','submitted_at'].includes(h)) return csvCell(r[h]);
          return csvCell(r.payload ? r.payload[h] : '');
        }).join(',')
      );
    } else if (activeItem.type === 'aijr_homework') {
      headers = ['student_name','cohort','class_number','homework_title','score','total','pct','submitted_at','access_code'];
      rows = rawData.map(r => headers.map(h => csvCell(r[h])).join(','));
    } else if (activeItem.type === 'aijr_midterm') {
      headers = ['student_name','test_id','auto_score','mcq_score','blank_score','total_possible','pct','submitted_at','access_code'];
      rows = rawData.map(r => headers.map(h => csvCell(r[h])).join(','));
    } else if (activeItem.type === 'aijr_final_exam') {
      headers = [
        'student_name','class_number','auto_score','mcq_score','blank_score','submitted_at','access_code',
        'q16_b1','q16_b2','q16_b3','q16_b4','q16_b5','q16_b6',
        'q17_text','q18_text',
        'q19_b1','q19_b2','q19_b3','q19_b4','q19_b5','q19_b6',
        'q20_b1','q20_b2','q20_b3','q20_b4','q20_b5',
        'q21_text'
      ];
      rows = rawData.map(r => headers.map(h => csvCell(r[h])).join(','));
    }

    var csv = [headers.join(','), ...rows].join('\n');
    var blob = new Blob([csv], { type: 'text/csv' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    var filename = (activeItem.slug || activeItem.type || 'submissions') + '_' + (activeCohort?.slug || activeCohortId) + '.csv';
    a.href = url; a.download = filename;
    a.click(); URL.revokeObjectURL(url);
  }

  // ── Utilities ─────────────────────────────────────────────────
  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmtDate(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleDateString('en-CA', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
  }
  function fmtDateFull(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleString('en-CA', { dateStyle:'medium', timeStyle:'short' });
  }
  function csvCell(v) {
    var s = v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
    return '"' + s.replace(/"/g, '""') + '"';
  }

  init();
</script>
</body>
</html>
