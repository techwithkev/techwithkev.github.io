<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Roster — Instructor Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/js/teacher-shared.js"></script>
  <style>
    :root{--navy:#0d1117;--surface:#161b22;--surface2:#1c2230;--border:#30363d;--gold:#f0b429;--text:#e6edf3;--muted:#7d8590;--green:#3fb950;--red:#f85149;--blue:#58a6ff;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;}
    .site-header{border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;}
    .back-link{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--gold);text-decoration:none;}
    .back-link:hover{text-decoration:underline;}
    .auth-badge{display:flex;align-items:center;gap:8px;font-size:.75rem;font-family:'DM Mono',monospace;color:var(--muted);}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
    .logout-btn{background:none;border:1px solid var(--border);color:var(--red);font-size:.72rem;font-family:'DM Mono',monospace;padding:3px 9px;border-radius:5px;cursor:pointer;}
    #login-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:400px;}
    .login-card h2{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;margin-bottom:20px;}
    .field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:.875rem;font-family:'DM Mono',monospace;outline:none;margin-bottom:10px;}
    .field input:focus{border-color:var(--gold);}
    .btn-gold{width:100%;background:var(--gold);color:#1a1200;font-weight:700;font-size:.9rem;padding:11px;border:none;border-radius:10px;cursor:pointer;font-family:'DM Sans',sans-serif;}
    #login-error{color:var(--red);font-size:.78rem;margin-top:8px;}
    #app{display:none;}
    .page-wrap{max-width:1200px;margin:0 auto;padding:40px 32px;}
    .page-label{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;}
    .page-title{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;}
    .page-title span{color:var(--gold);}
    .page-subtitle{color:var(--muted);font-size:.875rem;margin-top:6px;margin-bottom:32px;}
    .controls{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center;}
    .sel{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:.82rem;font-family:'DM Mono',monospace;outline:none;}
    .sel:focus{border-color:var(--gold);}
    .search{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:.82rem;font-family:'DM Mono',monospace;outline:none;width:240px;}
    .search:focus{border-color:var(--gold);}
    .btn-sm{padding:7px 14px;border-radius:7px;font-size:.78rem;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;}
    .btn-outline{background:none;border:1px solid var(--border);color:var(--text);}
    .btn-outline:hover{border-color:var(--gold);}
    /* Stats row */
    .stats-row{display:flex;gap:14px;margin-bottom:28px;flex-wrap:wrap;}
    .stat-chip{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 20px;}
    .stat-chip .val{font-family:'DM Mono',monospace;font-size:1.3rem;font-weight:700;color:var(--gold);}
    .stat-chip .lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
    /* Table */
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
    .data-table{width:100%;border-collapse:collapse;font-size:.83rem;}
    .data-table th{text-align:left;padding:11px 16px;font-family:'DM Mono',monospace;font-size:.67rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--border);}
    .data-table td{padding:12px 16px;border-bottom:1px solid rgba(48,54,61,.5);vertical-align:middle;}
    .data-table tr:last-child td{border-bottom:none;}
    .data-table tr:hover td{background:rgba(255,255,255,.02);}
    .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.7rem;font-family:'DM Mono',monospace;}
    .badge-green{background:rgba(63,185,80,.1);color:var(--green);border:1px solid rgba(63,185,80,.2);}
    .badge-gold{background:rgba(240,180,41,.1);color:var(--gold);border:1px solid rgba(240,180,41,.2);}
    .progress-wrap{display:flex;align-items:center;gap:8px;}
    .progress-bar{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;min-width:80px;}
    .progress-fill{height:100%;border-radius:3px;background:var(--green);transition:width .3s;}
    .progress-label{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);white-space:nowrap;}
    .empty-state{padding:48px;text-align:center;color:var(--muted);}
    .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#f472b6);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#1a1200;margin-right:8px;vertical-align:middle;flex-shrink:0;}
    .name-cell{display:flex;align-items:center;}
  </style>
</head>
<body>

<!-- ── LOGIN ──────────────────────────────────────────────── -->
<div id="login-gate">
  <div class="login-card">
    <h2>🔑 Teacher Sign-In</h2>
    <div class="field"><input type="email"    id="l-email"    placeholder="teacher@school.ca" /></div>
    <div class="field"><input type="password" id="l-password" placeholder="Password" /></div>
    <button class="btn-gold" onclick="doLogin()">Sign In</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ── APP ───────────────────────────────────────────────── -->
<div id="app">
  <header class="site-header">
    <a href="index.html" class="back-link">← Instructor Hub</a>
    <div class="auth-badge">
      <div class="dot"></div>
      <span id="auth-label">signed in</span>
      <button class="logout-btn" onclick="doLogout()">Sign Out</button>
    </div>
  </header>

  <div class="page-wrap">
    <p class="page-label">Students</p>
    <h1 class="page-title">Student <span>Roster</span></h1>
    <p class="page-subtitle">All enrolled students per cohort with submission counts and last activity. Populated from access code registrations.</p>

    <div class="controls">
      <select class="sel" id="course-sel" onchange="onCourseChange()">
        <option value="">Loading…</option>
      </select>
      <select class="sel" id="cohort-sel" onchange="loadRoster()">
        <option value="">All cohorts</option>
      </select>
      <input type="text" class="search" id="search-input" placeholder="Search student name or email…" oninput="filterTable()" />
      <button class="btn-sm btn-outline" onclick="exportCSV()">↓ CSV</button>
      <button class="btn-sm btn-outline" onclick="loadRoster()">↻</button>
    </div>

    <div class="stats-row" id="stats-row"></div>

    <div class="panel">
      <table class="data-table">
        <thead>
          <tr>
            <th>Student</th>
            <th>Email</th>
            <th>Cohort</th>
            <th>Submissions</th>
            <th>First Seen</th>
            <th>Last Active</th>
          </tr>
        </thead>
        <tbody id="roster-tbody">
          <tr><td colspan="6" class="empty-state">Select a course and cohort to view the roster.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  var sb = createTeacherClient();
  var currentUser = null;
  var rawRows = [];
  var filteredRows = [];
  var totalExercises = 0;

  // ── Auth ─────────────────────────────────────────────────────
  async function init() {
    var session = await getTeacherSession();
    if (session) { currentUser = session.user; setAuthed(); }
  }
  function setAuthed() {
    document.getElementById('login-gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('auth-label').textContent = currentUser.email;
    loadCourses();
  }
  async function doLogin() {
    var { user, error } = await TeacherAuth.login(
      document.getElementById('l-email').value.trim(),
      document.getElementById('l-password').value
    );
    if (error) { document.getElementById('login-error').textContent = error; return; }
    currentUser = user; setAuthed();
  }
  async function doLogout() { await TeacherAuth.logout(); location.reload(); }
  ['l-email','l-password'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); })
  );

  // ── Courses + Cohorts ─────────────────────────────────────────
  async function loadCourses() {
    var { data } = await sb.from('courses').select('id,name').eq('is_active',true).order('name');
    var sel = document.getElementById('course-sel');
    sel.innerHTML = (data||[]).map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    if (data && data.length) await onCourseChange();
  }

  async function onCourseChange() {
    var courseId = document.getElementById('course-sel').value;
    var { data } = await sb.from('cohorts').select('id,name,term').eq('course_id',courseId).eq('is_active',true).order('term',{ascending:false});
    var sel = document.getElementById('cohort-sel');
    sel.innerHTML = '<option value="">All cohorts</option>' +
      (data||[]).map(c=>`<option value="${c.id}">${c.name}</option>`).join('');

    // Get total exercises for this course
    var { count } = await sb.from('exercise_definitions').select('id',{count:'exact',head:true}).eq('course_id',courseId).eq('is_active',true);
    totalExercises = count || 0;

    await loadRoster();
  }

  async function loadRoster() {
    var cohortId = document.getElementById('cohort-sel').value;

    var query = sb
      .from('v_cohort_roster')
      .select('*')
      .order('last_seen_at', { ascending: false });

    if (cohortId) query = query.eq('cohort_id', cohortId);
    else {
      var courseId = document.getElementById('course-sel').value;
      if (courseId) query = query.eq('course_slug', getCourseSlug(courseId));
    }

    var { data, error } = await query.limit(500);

    rawRows = data || [];
    filteredRows = rawRows.slice();
    renderStats();
    renderTable();
  }

  function getCourseSlug(courseId) {
    var sel = document.getElementById('course-sel');
    var opt = sel.querySelector(`option[value="${courseId}"]`);
    return opt ? opt.textContent.toLowerCase().replace(/\s+/g,'-') : '';
  }

  function renderStats() {
    var total = rawRows.length;
    var totalSubs = rawRows.reduce((s, r) => s + (r.total_submissions || 0), 0);
    var active7d = rawRows.filter(r => r.last_seen_at && (new Date() - new Date(r.last_seen_at)) < 7 * 86400000).length;

    document.getElementById('stats-row').innerHTML = `
      <div class="stat-chip"><div class="val">${total}</div><div class="lbl">Students</div></div>
      <div class="stat-chip"><div class="val">${totalSubs}</div><div class="lbl">Total Submissions</div></div>
      <div class="stat-chip"><div class="val">${active7d}</div><div class="lbl">Active (7 days)</div></div>
      ${totalExercises ? `<div class="stat-chip"><div class="val">${totalExercises}</div><div class="lbl">Total Exercises</div></div>` : ''}
    `;
  }

  function renderTable() {
    var tbody = document.getElementById('roster-tbody');
    if (!filteredRows.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No students found. Students appear here after their first access code registration.</td></tr>';
      return;
    }

    tbody.innerHTML = filteredRows.map(r => {
      var initials = (r.student_name || '?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      var pct = totalExercises > 0 ? Math.round(((r.total_submissions||0)/totalExercises)*100) : null;
      var barColor = pct >= 80 ? 'var(--green)' : pct >= 40 ? 'var(--gold)' : 'var(--red)';
      return `
        <tr>
          <td>
            <div class="name-cell">
              <div class="avatar">${esc(initials)}</div>
              <span style="font-weight:600;">${esc(r.student_name)}</span>
            </div>
          </td>
          <td style="font-family:'DM Mono',monospace;font-size:.78rem;color:var(--muted);">${esc(r.student_email)}</td>
          <td><span class="badge badge-gold">${esc(r.cohort_name || '—')}</span></td>
          <td>
            <div class="progress-wrap">
              ${pct !== null ? `
                <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${barColor};"></div></div>
                <span class="progress-label">${r.total_submissions || 0}${totalExercises ? '/'+totalExercises : ''}</span>
              ` : `<span style="font-family:'DM Mono',monospace;font-size:.82rem;">${r.total_submissions || 0}</span>`}
            </div>
          </td>
          <td style="font-size:.78rem;color:var(--muted);">${fmtDate(r.first_seen_at)}</td>
          <td style="font-size:.78rem;color:var(--muted);">${fmtDate(r.last_seen_at)}</td>
        </tr>`;
    }).join('');
  }

  function filterTable() {
    var q = document.getElementById('search-input').value.toLowerCase();
    filteredRows = q
      ? rawRows.filter(r =>
          (r.student_name || '').toLowerCase().includes(q) ||
          (r.student_email || '').toLowerCase().includes(q)
        )
      : rawRows.slice();
    renderTable();
  }

  function exportCSV() {
    var headers = ['student_name','student_email','cohort_name','total_submissions','first_seen_at','last_seen_at'];
    var rows = filteredRows.map(r => headers.map(h => csvCell(r[h])).join(','));
    var csv = [headers.join(','), ...rows].join('\n');
    var blob = new Blob([csv],{type:'text/csv'});
    var a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='roster.csv'; a.click();
  }

  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function fmtDate(ts){if(!ts)return'—';return new Date(ts).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'});}
  function csvCell(v){var s=v==null?'':String(v);return'"'+s.replace(/"/g,'""')+'"';}

  init();
</script>
</body>
</html>
