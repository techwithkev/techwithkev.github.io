<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class 10 Homework — AI Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap"
    rel="stylesheet">

  <script defer>
    // ── DATA ─────────────────────────────────────────────────────────────────────
    const SECTIONS = [
      {
        id: "s1",
        title: "State Space & BFS vs DFS",
        badge: "01",
        questions: [
          {
            id: "q1", type: "mcq",
            stem: "Which data structure does Breadth-First Search (BFS) use to manage its frontier?",
            options: ["Stack (LIFO)", "Queue (FIFO)", "Priority Queue", "Hash Map"],
            correct: 1,
            hint1: "Think about how BFS explores nodes — layer by layer, not branch by branch.",
            hint2: "FIFO means the first node added is the first node explored. Which structure does that?",
            explanation: "BFS uses a Queue (FIFO). Nodes added first are explored first, which produces the level-by-level expansion pattern."
          },
          {
            id: "q2", type: "mcq",
            stem: "Which data structure does Depth-First Search (DFS) use to manage its frontier?",
            options: ["Queue (FIFO)", "Priority Queue", "Stack (LIFO)", "Linked List"],
            correct: 2,
            hint1: "DFS dives deep before backtracking — it always follows the most recently added node.",
            hint2: "LIFO means last in, first out. The most recently added node is explored first.",
            explanation: "DFS uses a Stack (LIFO). The most recently added node is always explored next, producing deep-first traversal."
          },
          {
            id: "q3", type: "mcq",
            stem: "BFS guarantees finding the shortest path measured in terms of:",
            options: ["Total edge cost", "Number of hops (edges)", "Time to explore", "Memory consumed"],
            correct: 1,
            hint1: "BFS does not know about edge costs — it only knows about connections.",
            hint2: "BFS explores all nodes at depth d before depth d+1, so it finds the path with the fewest steps.",
            explanation: "BFS finds the shortest path in terms of number of hops (edges). It does not account for edge costs — that is UCS's job."
          },
          {
            id: "q4", type: "mcq",
            stem: "Compared to BFS, DFS typically uses:",
            options: ["More memory", "The same memory", "Much less memory", "Infinite memory"],
            correct: 2,
            hint1: "BFS stores the entire frontier; DFS only stores the current path.",
            hint2: "BFS at depth d must store up to b^d nodes. DFS only needs b*m nodes where m is max depth.",
            explanation: "DFS uses much less memory. It only stores the current path branch (O(b*m)), while BFS stores the entire frontier (O(b^d))."
          },
          {
            id: "q5", type: "fill",
            stem: "Complete the sentence: BFS is _______ but uses more _______ than DFS.",
            correct: ["optimal, memory", "optimal and complete, memory"],
            display_correct: "optimal, memory",
            hint1: "Think about what BFS guarantees that DFS does not.",
            hint2: "BFS finds the best path (fewest hops) but must store all frontier nodes.",
            explanation: "BFS is optimal (finds shortest path in hops) but uses more memory than DFS, since it stores the entire frontier."
          }
        ]
      },
      {
        id: "s2",
        title: "Uniform Cost Search & Negative Costs",
        badge: "02",
        questions: [
          {
            id: "q6", type: "mcq",
            stem: "UCS always expands the node with the lowest:",
            options: ["Heuristic estimate h(n)", "Combined f(n) = g(n) + h(n)", "Cumulative cost g(n) from start", "Number of neighbours"],
            correct: 2,
            hint1: "UCS does not use a heuristic. It only considers what has already been paid.",
            hint2: "g(n) is the actual cost from the start node to node n.",
            explanation: "UCS expands the node with the lowest cumulative cost g(n). It uses a priority queue ordered by g(n)."
          },
          {
            id: "q7", type: "mcq",
            stem: "Graph: A--(4)-->B--(2)-->C and A--(1)-->C. What does UCS find as the cheapest path A to C?",
            options: ["A -> B -> C (cost 6)", "A -> C (cost 1)", "Both paths, cost 7", "UCS cannot decide"],
            correct: 1,
            hint1: "UCS always expands the cheapest cumulative cost first.",
            hint2: "The direct path A->C has cost 1. A->B->C has cost 4+2=6. UCS will find A->C first.",
            explanation: "UCS correctly finds A->C (cost 1) because it always expands the cheapest frontier node. A->B->C costs 6, so it is never preferred."
          },
          {
            id: "q8", type: "mcq",
            stem: "Exam Q12: Why does UCS fail when a graph contains negative edge costs?",
            options: [
              "It uses a queue instead of a priority queue",
              "A closed node may later have a cheaper path via a negative edge",
              "It cannot store negative numbers in Python",
              "It never marks nodes as visited"
            ],
            correct: 1,
            hint1: "UCS marks nodes 'closed' when popped. What happens if a later path is cheaper?",
            hint2: "Negative edges mean paths can get CHEAPER as you go further. UCS assumes paths only get longer.",
            explanation: "UCS fails because it closes nodes assuming no cheaper path exists. A negative edge can make a previously-closed node reachable at a lower cost, but UCS will not re-open it."
          },
          {
            id: "q9", type: "mcq",
            stem: "Which of these graphs can UCS solve correctly and optimally?",
            options: [
              "A graph with one negative edge cost",
              "A graph where all edges cost -1",
              "A graph where all edges cost 0",
              "A graph with a cycle of negative total cost"
            ],
            correct: 2,
            hint1: "UCS requires costs to be non-negative. Zero is non-negative.",
            hint2: "All-zero costs means UCS behaves like BFS — every path has cost 0, no negative edges.",
            explanation: "UCS works correctly when all edge costs are >= 0. A graph with all-zero edges satisfies this — UCS behaves like BFS."
          },
          {
            id: "q10", type: "fill",
            stem: "UCS uses a _______ queue ordered by _______ to always expand the cheapest node.",
            correct: ["priority, g(n)", "priority, cumulative cost", "priority queue, g(n)"],
            display_correct: "priority, g(n)",
            hint1: "The data structure must automatically sort nodes by their path cost.",
            hint2: "g(n) is the standard notation for cumulative cost from start to n.",
            explanation: "UCS uses a priority queue ordered by g(n) — the cumulative cost from start to node n. The heapq module in Python provides this."
          }
        ]
      },
      {
        id: "s3",
        title: "A* Search & Weighted A*",
        badge: "03",
        questions: [
          {
            id: "q11", type: "mcq",
            stem: "In A* search, what does f(n) represent?",
            options: [
              "The actual cost from start to n",
              "The heuristic estimate from n to goal",
              "The total estimated cost of the path through n",
              "The branching factor at n"
            ],
            correct: 2,
            hint1: "f(n) combines two components — one known, one estimated.",
            hint2: "f(n) = g(n) + h(n). g is actual cost, h is the estimate. Together they estimate the full path cost.",
            explanation: "f(n) = g(n) + h(n) is the total estimated cost of a path that goes through node n. A* always expands the node with the lowest f(n)."
          },
          {
            id: "q12", type: "mcq",
            stem: "A heuristic h(n) is admissible if it:",
            options: [
              "Always overestimates the remaining cost",
              "Equals the true remaining cost exactly",
              "Never overestimates the remaining cost",
              "Always returns zero"
            ],
            correct: 2,
            hint1: "Admissibility is about being optimistic — the estimate should not be too high.",
            hint2: "If h(n) > true cost, A* might skip the optimal path thinking it is too expensive.",
            explanation: "Admissible means h(n) <= true remaining cost for all nodes n. This ensures A* never discards the optimal path."
          },
          {
            id: "q13", type: "mcq",
            stem: "Which is always an admissible heuristic for any problem?",
            options: [
              "h(n) = 100 for all n",
              "h(n) = 0 for all n",
              "h(n) = number of nodes remaining",
              "h(n) = true cost * 2"
            ],
            correct: 1,
            hint1: "If h never overestimates, what is the safest possible value it could return?",
            hint2: "Zero is always <= any non-negative true cost. So h=0 is trivially admissible.",
            explanation: "h(n) = 0 is always admissible because 0 <= any non-negative cost. With h=0, A* becomes identical to UCS."
          },
          {
            id: "q14", type: "mcq",
            stem: "Exam Q11: Weighted A* uses f(n) = g(n) + w*h(n) with w > 1. What is the effect vs standard A*?",
            options: [
              "Slower search but guaranteed optimal",
              "Faster search and still guaranteed optimal",
              "Faster search but possibly sub-optimal",
              "Same speed, same optimality"
            ],
            correct: 2,
            hint1: "Increasing w makes the algorithm trust the heuristic more and rush toward the goal.",
            hint2: "Rushing = fewer node expansions = faster. But it may miss a cheaper path.",
            explanation: "Weighted A* with w > 1 is faster (expands fewer nodes) because it prioritises the goal direction more aggressively. But it is no longer guaranteed optimal — it may return a sub-optimal path."
          },
          {
            id: "q15", type: "mcq",
            stem: "If you set w = 1 in Weighted A*, what algorithm do you get?",
            options: ["BFS", "DFS", "Standard A*", "Greedy Best-First Search"],
            correct: 2,
            hint1: "f(n) = g(n) + 1*h(n) = g(n) + h(n). Recognise this formula?",
            hint2: "w=1 means the formula is exactly the standard A* formula.",
            explanation: "w = 1 gives f(n) = g(n) + h(n) — the standard A* formula. Weighted A* is just A* with a tunable heuristic weight."
          },
          {
            id: "q16", type: "fill",
            stem: "Complete: A* with h(n) = 0 for all n behaves exactly like _______.",
            correct: ["ucs", "uniform cost search", "UCS", "Uniform Cost Search"],
            display_correct: "Uniform Cost Search (UCS)",
            hint1: "With h=0, f(n) = g(n) + 0 = g(n). Which algorithm expands by g(n)?",
            hint2: "UCS expands the node with the lowest cumulative cost g(n). That is exactly what A* does when h=0.",
            explanation: "A* with h=0 reduces to f(n) = g(n), which is exactly UCS. This is why UCS is a special case of A*."
          },
          {
            id: "q17", type: "mcq",
            stem: "For GPS route finding, which heuristic is admissible?",
            options: [
              "Number of traffic lights on the route",
              "Straight-line (Euclidean) distance to destination",
              "Speed limit on the current road",
              "Total number of road segments remaining"
            ],
            correct: 1,
            hint1: "An admissible heuristic must never overestimate. Think about what is always <= road distance.",
            hint2: "The straight line between two points is always the shortest possible distance.",
            explanation: "Straight-line distance is always admissible because the actual road distance is always >= the straight-line distance. It never overestimates."
          }
        ]
      },
      {
        id: "s4",
        title: "Algorithm Comparison & Exam Q35",
        badge: "04",
        questions: [
          {
            id: "q18", type: "mcq",
            stem: "Which algorithm would you choose for web crawling, and why? (Exam Q35)",
            options: [
              "DFS — it explores the deepest pages first, finding all content",
              "UCS — it follows the cheapest links, reducing bandwidth",
              "BFS — it explores all pages at depth d before going to depth d+1",
              "A* — it uses a heuristic to find the most popular pages"
            ],
            correct: 2,
            hint1: "Web crawling needs to discover all pages close to the start before going deep.",
            hint2: "BFS explores level-by-level. This ensures all nearby pages are found before distant ones.",
            explanation: "BFS is best for web crawling. It systematically covers all pages at each link depth before going deeper, ensuring complete coverage of nearby pages. DFS might get lost in deep chains; A* needs a heuristic that is hard to define for web pages."
          },
          {
            id: "q19", type: "mcq",
            stem: "Which algorithm is complete (always finds a goal if one exists)?",
            options: [
              "DFS on any graph, with no visited set",
              "BFS on any finite graph with a visited set",
              "Weighted A* with very large w",
              "DFS on an infinite graph"
            ],
            correct: 1,
            hint1: "Complete means the algorithm is guaranteed to find the goal if it exists.",
            hint2: "DFS without a visited set can loop forever. BFS with a visited set always terminates on finite graphs.",
            explanation: "BFS on a finite graph with a visited set is complete. DFS without a visited set is not complete — it can enter infinite loops in cyclic graphs."
          },
          {
            id: "q20", type: "mcq",
            stem: "Which algorithm is NOT optimal — it may return a longer or more expensive path?",
            options: ["BFS on an unweighted graph", "UCS on a positive-cost graph", "DFS", "A* with admissible h(n)"],
            correct: 2,
            hint1: "Optimal means it always finds the cheapest/shortest path. Which algorithm makes no such guarantee?",
            hint2: "DFS explores based on depth, not cost or hops — it may find a long path before a short one.",
            explanation: "DFS is not optimal. It follows branches based on stack order, not cost or hops, so it may return a longer path than necessary."
          },
          {
            id: "q21", type: "mcq",
            stem: "What is the key difference between UCS and A*?",
            options: [
              "UCS uses a stack; A* uses a queue",
              "A* adds an admissible heuristic h(n) to guide expansion",
              "UCS handles negative costs; A* does not",
              "A* is not complete; UCS always is"
            ],
            correct: 1,
            hint1: "Both algorithms use a priority queue. The difference is in what they prioritise.",
            hint2: "A* expands by f(n) = g(n) + h(n). UCS expands by g(n) alone.",
            explanation: "The key difference is A*'s heuristic h(n). UCS expands by g(n) alone; A* adds h(n) to guide the search toward the goal more efficiently."
          },
          {
            id: "q22", type: "mcq",
            stem: "A search algorithm expands 1000 nodes to find a path. Weighted A* (w=5) on the same graph expands 120 nodes but the path is slightly longer. This is an example of:",
            options: [
              "Admissibility violation — the algorithm is broken",
              "The speed/optimality tradeoff of Weighted A*",
              "BFS finding the wrong path",
              "UCS failing on negative costs"
            ],
            correct: 1,
            hint1: "w > 1 in Weighted A* trades something for speed. What does it trade?",
            hint2: "Fewer node expansions = faster. But the path may not be cheapest. This is the intended tradeoff.",
            explanation: "This is exactly the Weighted A* tradeoff (Exam Q11): w > 1 dramatically reduces node expansions (faster) at the cost of guaranteed optimality. The path found is good but may not be the absolute cheapest."
          },
          {
            id: "q23", type: "fill",
            stem: "Fill in the blank: BFS uses a _______, DFS uses a _______, and UCS uses a _______.",
            correct: ["queue, stack, priority queue", "Queue, Stack, Priority Queue", "FIFO queue, stack, priority queue"],
            display_correct: "queue, stack, priority queue",
            hint1: "Each algorithm is defined by its data structure. List them in BFS, DFS, UCS order.",
            hint2: "Queue=FIFO, Stack=LIFO, Priority Queue=ordered by cost.",
            explanation: "BFS=Queue(FIFO), DFS=Stack(LIFO), UCS=Priority Queue (by g(n)). A* also uses a priority queue, but ordered by f(n)=g(n)+h(n)."
          }
        ]
      },
      {
        id: "s5",
        title: "Coding & Tracing",
        badge: "05",
        questions: [
          {
            id: "q24", type: "mcq",
            stem: "In the BFS code below, what single change converts it to DFS?\n\nqueue = deque([(start, [start])])\nnode, path = queue.popleft()",
            options: [
              "Replace deque with list and use list.append()",
              "Replace popleft() with pop()",
              "Replace deque with set()",
              "Add a priority sort before popleft()"
            ],
            correct: 1,
            hint1: "The data structure is the same (deque). The change is in which end we pop from.",
            hint2: "popleft() = FIFO = BFS. pop() = LIFO = DFS. The only change needed is the pop direction.",
            explanation: "Replacing popleft() with pop() makes deque act as a LIFO stack, converting BFS into DFS. The algorithm is otherwise identical — only the exploration order changes."
          },
          {
            id: "q25", type: "mcq",
            stem: "The UCS priority queue stores tuples as (cost, node, path). Why must cost be the FIRST element?",
            options: [
              "Python requires all tuples to start with a number",
              "heapq sorts by the first element — putting cost first ensures cheapest node is always popped",
              "It makes the code more readable",
              "path must be last to avoid a TypeError"
            ],
            correct: 1,
            hint1: "heapq.heappop() returns the tuple with the smallest value. It compares tuples element by element.",
            hint2: "If cost is first, heapq always pops the cheapest node. If path were first, heapq would sort alphabetically by path.",
            explanation: "heapq compares tuples element-by-element. Putting cost first ensures the priority queue always pops the node with the lowest cumulative cost g(n) — the defining property of UCS."
          }
        ]
      }
    ];

    // ── STATE ─────────────────────────────────────────────────────────────────────
    const state = {
      studentName: "",
      currentSection: 0,
      sections: SECTIONS.map(s => ({
        id: s.id,
        unlocked: true,
        completed: false,
        score: 0,
        maxScore: s.questions.length,
        questions: s.questions.map(q => ({
          id: q.id,
          strikes: 0,
          answered: false,
          correct: false,
          hintsShown: 0
        }))
      })),
      startTime: Date.now(),
      submitted: false
    };

    function qState(qid) {
      for (const s of state.sections) {
        const q = s.questions.find(q => q.id === qid);
        if (q) return q;
      }
    }

    function sectionState(sid) {
      return state.sections.find(s => s.id === sid);
    }

    // ── SCORING ───────────────────────────────────────────────────────────────────
    function scoreForQuestion(qid) {
      const qs = qState(qid);
      if (!qs || !qs.correct) return 0;
      if (qs.strikes === 0) return 3;
      if (qs.strikes === 1) return 2;
      if (qs.strikes === 2) return 1;
      return 0;
    }

    function totalScore() {
      let score = 0, max = 0;
      for (const s of SECTIONS) {
        for (const q of s.questions) {
          max += 3;
          score += scoreForQuestion(q.id);
        }
      }
      return { score, max };
    }

    function sectionScore(sid) {
      const sec = SECTIONS.find(s => s.id === sid);
      let score = 0, max = 0;
      for (const q of sec.questions) {
        max += 3;
        score += scoreForQuestion(q.id);
      }
      return { score, max };
    }

    function isSectionComplete(sid) {
      const sec = SECTIONS.find(s => s.id === sid);
      return sec.questions.every(q => {
        const qs = qState(q.id);
        return qs.answered;
      });
    }

    // ── RENDER ────────────────────────────────────────────────────────────────────
    function render() {
      const app = document.getElementById("app");
      if (!state.studentName) {
        app.innerHTML = renderNameGate();
      } else if (state.submitted) {
        app.innerHTML = renderResults();
      } else {
        app.innerHTML = renderMain();
      }
      attachListeners();
    }

    function renderNameGate() {
      return `
  <div class="gate-wrap">
    <div class="gate-card">
      <div class="gate-badge">CLASS 10</div>
      <h1 class="gate-title">AI Search<br>Homework</h1>
      <p class="gate-sub">BFS &bull; DFS &bull; UCS &bull; A* &bull; Weighted A*</p>
      <div class="gate-meta">
        <span>5 Sections</span>
        <span class="dot"></span>
        <span>25 Questions</span>
        <span class="dot"></span>
        <span>3 strikes each</span>
      </div>
      <label class="name-label">Your full name</label>
      <input class="name-input" id="nameInput" type="text" placeholder="First Last" autocomplete="name">
      <button class="start-btn" id="startBtn">Begin Exercise</button>
    </div>
  </div>`;
    }

    function renderMain() {
      const sec = SECTIONS[state.currentSection];
      const ss = sectionState(sec.id);
      const sc = sectionScore(sec.id);
      const { score, max } = totalScore();
      const progress = Math.round((score / max) * 100);

      return `
  <div class="layout">
    <nav class="nav">
      <div class="nav-left">
        <div class="nav-logo">
          <span class="pulse"></span>
          <span class="nav-title">Class 10 &mdash; AI Search</span>
        </div>
      </div>
      <div class="nav-right">
        <div class="nav-score">
          <span class="score-num">${score}</span>
          <span class="score-sep">/</span>
          <span class="score-max">${max} pts</span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar" style="width:${progress}%"></div>
        </div>
      </div>
    </nav>

    <div class="sidebar">
      <div class="student-pill">${state.studentName}</div>
      ${SECTIONS.map((s, i) => {
        const ss2 = sectionState(s.id);
        const sc2 = sectionScore(s.id);
        const done = isSectionComplete(s.id);
        const active = i === state.currentSection;
        return `<button class="sec-btn ${active ? 'active' : ''} ${done ? 'done' : ''}"
          data-sec="${i}">
          <span class="sec-badge">${s.badge}</span>
          <span class="sec-name">${s.title}</span>
          ${done ? `<span class="sec-pts">${sc2.score}/${sc2.max * 3}</span>` : ''}
        </button>`;
      }).join('')}
      <button class="submit-btn" id="submitBtn" ${allDone() ? '' : 'disabled'}>
        ${allDone() ? 'Submit Exercise' : 'Complete all sections to submit'}
      </button>
    </div>

    <main class="content">
      <div class="sec-header">
        <div class="sec-number-big">${sec.badge}</div>
        <div>
          <h2 class="sec-heading">${sec.title}</h2>
          <div class="sec-stats">${sc.score}/${sc.max * 3} points &bull; ${sec.questions.length} questions</div>
        </div>
      </div>
      <div class="questions-list">
        ${sec.questions.map((q, qi) => renderQuestion(q, qi)).join('')}
      </div>
      ${isSectionComplete(sec.id) ? renderSectionPass(sec.id) : ''}
    </main>
  </div>`;
    }

    function allDone() {
      return SECTIONS.every(s => isSectionComplete(s.id));
    }

    function renderQuestion(q, qi) {
      const qs = qState(q.id);
      const done = qs.answered;
      const locked = qs.strikes >= 3 && !done;

      let body = '';
      if (q.type === 'mcq') {
        body = q.options.map((opt, i) => {
          let cls = 'option';
          if (done) {
            if (i === q.correct) cls += ' correct';
            else if (qs.lastChosen === i && !qs.correct) cls += ' wrong';
          }
          return `<button class="option ${done && i !== q.correct ? 'disabled-opt' : ''}"
        data-qid="${q.id}" data-ans="${i}"
        ${done ? 'disabled' : ''}>
        <span class="opt-letter">${String.fromCharCode(65 + i)}</span>
        <span class="opt-text">${opt}</span>
        ${done && i === q.correct ? '<span class="opt-check">&#10003;</span>' : ''}
        ${done && qs.lastChosen === i && !qs.correct ? '<span class="opt-cross">&#10007;</span>' : ''}
      </button>`;
        }).join('');
      } else {
        body = `<div class="fill-wrap">
      <input class="fill-input" id="fill_${q.id}" type="text"
        placeholder="Type your answer here…"
        ${done ? 'disabled value="' + (qs.correct ? q.display_correct : qs.lastAnswer || '') + '"' : ''}>
      <button class="fill-submit" data-qid="${q.id}" data-type="fill" ${done ? 'disabled' : ''}>Check</button>
    </div>`;
      }

      const strikes = qs.strikes;
      const strikeDots = [0, 1, 2].map(i =>
        `<span class="strike-dot ${i < strikes ? 'hit' : ''}"></span>`
      ).join('');

      const hint = qs.hintsShown > 0 ? `<div class="hint-box">
    <span class="hint-label">Hint ${qs.hintsShown}</span>
    <span>${qs.hintsShown === 1 ? q.hint1 : q.hint2}</span>
  </div>` : '';

      const feedback = done ? `<div class="explanation ${qs.correct ? 'exp-correct' : 'exp-wrong'}">
    <span class="exp-icon">${qs.correct ? '&#9989;' : '&#10060;'}</span>
    <span>${q.explanation}</span>
  </div>` : '';

      return `<div class="qcard ${done ? (qs.correct ? 'qcard-correct' : 'qcard-wrong') : ''}" id="qcard_${q.id}">
    <div class="qcard-top">
      <span class="qnum">Q${qi + 1}</span>
      <span class="strike-wrap" title="Strikes used">${strikeDots}</span>
    </div>
    <div class="qstem">${q.stem.replace(/\n/g, '<br>')}</div>

    function renderResults() {
      const { score, max } = totalScore();
      const pct = Math.round((score / max) * 100);
      const elapsed = Math.round((Date.now() - state.startTime) / 60000);
      const grade = pct >= 90 ? 'Excellent' : pct >= 70 ? 'Good' : pct >= 50 ? 'Keep Practising' : 'Review Class Notes';

      return `

    <div class="results-card">

      <div class="res-meta">${elapsed} min &bull; ${state.studentName}</div>

      }).join('')}

        <span>Uploading results...</span>

    // ── EVENT LISTENERS ───────────────────────────────────────────────────────────
    function attachListeners() {
      const nameInput = document.getElementById("nameInput");
      const startBtn = document.getElementById("startBtn");
      if (startBtn) {
        startBtn.addEventListener("click", () => {
          const v = (nameInput ? nameInput.value : "").trim();
          if (v.length < 2) { nameInput.classList.add("shake"); setTimeout(() => nameInput.classList.remove("shake"), 400); return; }
          state.studentName = v;
          state.startTime = Date.now();
          render();
        });
        if (nameInput) nameInput.addEventListener("keydown", e => { if (e.key === "Enter") startBtn.click(); });
      }

      // Section nav
      document.querySelectorAll(".sec-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.dataset.sec);
          state.currentSection = idx;
          render();
        });
      });

      // MCQ options
      document.querySelectorAll(".option[data-qid]").forEach(btn => {
        btn.addEventListener("click", () => {
          const qid = btn.dataset.qid;
          const ans = parseInt(btn.dataset.ans);
          handleMCQ(qid, ans);
        });
      });

      // Fill answers
      document.querySelectorAll(".fill-submit").forEach(btn => {
        btn.addEventListener("click", () => {
          const qid = btn.dataset.qid;
          const input = document.getElementById("fill_" + qid);
          if (input) handleFill(qid, input.value);
        });
      });
      document.querySelectorAll(".fill-input").forEach(input => {
        input.addEventListener("keydown", e => {
          if (e.key === "Enter") {
            const qid = input.id.replace("fill_", "");
            handleFill(qid, input.value);
          }
        });
      });

      // (section gating removed — all sections open from start)

      // Submit
      const submitBtn = document.getElementById("submitBtn");
      if (submitBtn) {
        submitBtn.addEventListener("click", () => {
          state.submitted = true;
          render();
          uploadResults();
        });
      }
    }

    function handleMCQ(qid, ans) {
      const qs = qState(qid);
      if (qs.answered) return;
      const q = findQuestion(qid);
      qs.lastChosen = ans;

      if (ans === q.correct) {
        qs.correct = true;
        qs.answered = true;
        updateSectionScore();
      } else {
        qs.strikes++;
        if (qs.strikes >= 3) {
          qs.answered = true;
          qs.correct = false;
        } else {
          qs.hintsShown = qs.strikes;
        }
      }
      render();
    }

    function handleFill(qid, val) {
      const qs = qState(qid);
      if (qs.answered) return;
      const q = findQuestion(qid);
      const normalized = val.trim().toLowerCase();
      const isCorrect = q.correct.some(c => c.toLowerCase() === normalized);
      qs.lastAnswer = val.trim();

      if (isCorrect) {
        qs.correct = true;
        qs.answered = true;
        updateSectionScore();
      } else {
        qs.strikes++;
        if (qs.strikes >= 3) {
          qs.answered = true;
          qs.correct = false;
        } else {
          qs.hintsShown = qs.strikes;
        }
      }
      render();
    }

    function findQuestion(qid) {
      for (const s of SECTIONS) {
        const q = s.questions.find(q => q.id === qid);
        if (q) return q;
      }
    }

      // called after each correct answer — section scores are computed dynamically
    }

      margin-top: 1px;
    }

    /* ── PASS BANNER ─────────────────────────────────────────────── */
    .pass-banner {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--teal);
      border-radius: 12px;
      padding: 18px 22px;
      margin-top: 24px;
      color: var(--white);
    }

    .pass-icon {
      font-size: 24px;
      width: 44px;
      height: 44px;
      background: var(--lime);
      color: var(--teal);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }

    .pass-title {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 3px;
    }

    .pass-pts {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
    }

    .pass-next {
      margin-left: auto;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      font-family: 'IBM Plex Mono', monospace;
      flex-shrink: 0;
    }

    /* ── RESULTS ─────────────────────────────────────────────────── */
    .results-wrap {
      min-height: 100vh;
      background: var(--teal);
      background-image: radial-gradient(ellipse at 30% 70%, #1a4a5c 0%, transparent 60%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .results-card {
      background: var(--white);
      border-radius: 20px;
      padding: 52px 48px;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
    }

    .res-badge {
      display: inline-block;
      background: var(--lime);
      color: var(--teal);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .res-score {
      font-family: 'Playfair Display', serif;
      font-size: 80px;
      color: var(--teal);
      line-height: 1;
      margin-bottom: 8px;
    }

    .res-max {
      font-size: 32px;
      color: var(--muted);
    }

    .res-pct {
      font-size: 20px;
      font-weight: 600;
      color: var(--teal);
      margin-bottom: 6px;
    }

    .res-meta {
      font-size: 13px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      margin-bottom: 28px;
    }

    .res-sections {
      border-top: 1px solid var(--border);
      padding-top: 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .res-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .res-sec-name {
      font-size: 14px;
      color: var(--text);
    }

    .res-sec-pts {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--teal);
    }

    .res-upload {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    .upload-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .upload-ok {
      color: var(--green);
      font-weight: 600;
    }

    .upload-fail {
      color: var(--red);
      font-weight: 600;
    }
  </style>
</head>

  <div id="app"></div>
</body>
